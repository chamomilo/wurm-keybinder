window.intro.title=Boas-vindas ao Keybinder
window.editor.title=Construtor de atalhos
intro.heading=BOAS-VINDAS AO KEYBINDER
intro.lead=O Keybinder torna o uso do teclado mais fácil, claro e totalmente integrado ao Wurm.
intro.description=Ele substitui tanto o gerenciamento padrão de atalhos quanto os comandos complexos de console usados por diferentes mods. Isto não é automação nem script — é apenas uma forma muito mais prática de usar ações simples e complexas vinculadas a teclas.
intro.actions.heading=UMA TECLA — MUITAS AÇÕES, FERRAMENTAS E ALVOS
intro.actions.body=Um atalho pode conter vários comandos do Wurm, até o limite da fila de ações do personagem. Escolha uma ação da lista padrão, digite um comando de console ou use Capturar ação. Execute uma ação normalmente e o Keybinder a adicionará ao atalho.
intro.targets.body=Para cada ação, escolha a ferramenta e o alvo necessários: objeto sob o cursor, selecionado, exato ou próximo, sua montaria, pisos, áreas e muito mais. Esse sistema flexível foi inspirado no Custom Actions de bdew.
intro.migration.body=O Keybinder pode importar atalhos existentes do Wurm e do Custom Actions para que tudo seja gerenciado em uma única janela.
intro.multi.heading=ATALHOS MULTIFUNÇÃO
intro.multi.body=Um atalho multifunção atribui várias ações à mesma tecla. Toque na tecla para usar a ação ativa ou segure por mais de um segundo para escolher outra.
intro.profiles.heading=PERSONAGENS E SERVIDORES DIFERENTES
intro.profiles.body=Crie conjuntos de atalhos separados para personagens e servidores diferentes e alterne entre eles com facilidade.
intro.improve.heading=SMART IMPROVE
intro.improve.body=O Keybinder inclui uma versão atualizada da conhecida lógica do Improved Improve.
intro.improve.instructions=Escolha a tecla que deseja usar para melhorar itens e mantenha todas as ferramentas necessárias no cinto. O antigo Improved Improve não é mais necessário.
intro.interface=Tudo é configurado por uma interface clara, no estilo do Wurm. Não é preciso usar o console.
intro.closing=Espero que você goste deste mod tanto quanto eu :)
intro.signature=Um abraço! Chamomilo
intro.support.heading=APOIE SEU NOVO KEYBINDER
intro.support.body=Se quiser agradecer ou apoiar meu trabalho, entre no servidor SKLOTOPOLIS e envie uma mensagem para Chamomilo ou algumas moedas do jogo.
intro.support.thanks=Prata ou cobre — qualquer quantia que parecer adequada. Agradeço desde já!
intro.credits.heading=AGRADECIMENTOS AOS MODDERS QUE INSPIRARAM O KEYBINDER
