window.intro.title=Welcome to Keybinder
window.editor.title=Keybind constructor
intro.heading=WELCOME TO KEYBINDER
intro.lead=Keybinder makes working with your keyboard easier, clearer, and completely at home in Wurm.
intro.description=It replaces both vanilla keybind management and complicated console binds used by different mods. This is not automation or scripting — it is simply a much more convenient way to use simple and complex actions bound to keys.
intro.actions.heading=ONE KEY — MANY ACTIONS, TOOLS, AND TARGETS
intro.actions.body=A keybind can contain several Wurm commands, up to the length of your character's action queue. Choose an action from the vanilla list, enter a console command, or use Capture Action. Perform an action normally and Keybinder will add it to your keybind.
intro.targets.body=For every action, select the tool and target you need: hovered, selected, exact or nearby objects, your ride, tiles, areas, and more. This flexible targeting system was inspired by bdew's Custom Actions.
intro.migration.body=Keybinder can import existing vanilla and Custom Actions keybinds so you can manage everything from one window.
intro.multi.heading=MULTI-KEYBINDS
intro.multi.body=A multi-keybind assigns several actions to the same key. Tap the key for the active action or hold it for more than one second to choose another.
intro.profiles.heading=DIFFERENT CHARACTERS, DIFFERENT SERVERS
intro.profiles.body=Create separate keybind sets for different characters and servers, then switch between them easily.
intro.improve.heading=SMART IMPROVE
intro.improve.body=Keybinder includes an updated version of the famous Improved Improve logic.
intro.improve.instructions=Choose the key you want to use for improving and keep all required tools in your inventory or backpacks. The old Improved Improve mod is no longer required.
intro.interface=Everything is configured through a clear, Wurm-styled interface. No console work is required.
intro.closing=I hope you will love this mod as much as I do :)
intro.signature=Cheers! Chamomilo
intro.support.heading=SUPPORT YOUR NEW KEYBINDER
intro.support.body=If you would like to say thank you or support my work, please join the SKLOTOPOLIS server and send Chamomilo a message or a few in-game coins.
intro.support.thanks=Silver or copper — whatever amount feels appropriate. Thank you in advance!
intro.credits.heading=WITH THANKS TO THE MODDERS WHO INSPIRED KEYBINDER
