window.title=Keybinder
window.intro.title=Willkommen bei Keybinder
window.editor.title=Tastenbelegungs-Editor
intro.heading=WILLKOMMEN BEI KEYBINDER
intro.lead=Keybinder macht die Bedienung per Tastatur einfacher, übersichtlicher und fügt sich nahtlos in Wurm ein.
intro.description=Er ersetzt sowohl die Verwaltung der normalen Tastenbelegungen als auch komplizierte Konsolenbelegungen verschiedener Mods. Dies ist keine Automatisierung und kein Skript – lediglich eine wesentlich bequemere Art, einfache und komplexe Aktionen per Taste auszuführen.
intro.actions.heading=EINE TASTE – VIELE AKTIONEN, WERKZEUGE UND ZIELE
intro.actions.body=Eine Tastenbelegung kann mehrere Wurm-Befehle bis zur Länge der Aktionswarteschlange deines Charakters enthalten. Wähle eine Aktion aus der normalen Liste, gib einen Konsolenbefehl ein oder verwende Aktion aufzeichnen. Führe eine Aktion wie gewohnt aus, und Keybinder fügt sie deiner Tastenbelegung hinzu.
intro.targets.body=Wähle für jede Aktion das benötigte Werkzeug und Ziel: Objekte unter dem Mauszeiger, ausgewählte, bestimmte oder nahe Objekte, dein Reittier, Felder, Bereiche und mehr. Dieses flexible Zielsystem wurde von bdews Custom Actions inspiriert.
intro.migration.body=Keybinder kann bestehende normale Tastenbelegungen und Custom-Actions-Belegungen importieren, damit du alles in einem Fenster verwalten kannst.
intro.multi.heading=MULTI-TASTENBELEGUNGEN
intro.multi.body=Eine Multi-Tastenbelegung weist derselben Taste mehrere Aktionen zu. Tippe die Taste für die aktive Aktion kurz an oder halte sie länger als eine Sekunde, um eine andere auszuwählen.
intro.profiles.heading=VERSCHIEDENE CHARAKTERE, VERSCHIEDENE SERVER
intro.profiles.body=Erstelle getrennte Tastenbelegungssätze für verschiedene Charaktere und Server und wechsle bequem zwischen ihnen.
intro.improve.heading=SMART IMPROVE
intro.improve.body=Keybinder enthält eine aktualisierte Version der bekannten Improved-Improve-Logik.
intro.improve.instructions=Wähle die Taste zum Verbessern und bewahre alle benötigten Werkzeuge in deinem Inventar oder deinen Rucksäcken auf. Der alte Improved-Improve-Mod wird nicht mehr benötigt.
intro.interface=Alles wird über eine übersichtliche Oberfläche im Wurm-Stil konfiguriert. Die Konsole wird nicht benötigt.
intro.closing=Ich hoffe, du wirst diesen Mod genauso lieben wie ich :)
intro.signature=Viele Grüße! Chamomilo
intro.support.heading=UNTERSTÜTZE DEINEN NEUEN KEYBINDER
intro.support.body=Wenn du dich bedanken oder meine Arbeit unterstützen möchtest, komm bitte auf den SKLOTOPOLIS-Server und sende Chamomilo eine Nachricht oder ein paar Münzen im Spiel.
intro.support.thanks=Silber oder Kupfer – welcher Betrag auch immer angemessen erscheint. Vielen Dank im Voraus!
intro.credits.heading=MIT DANK AN DIE MODDER, DIE KEYBINDER INSPIRIERT HABEN
