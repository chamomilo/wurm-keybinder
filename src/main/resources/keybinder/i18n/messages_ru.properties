help.constructor_heading=КОНСТРУКТОР КЕЙБИНДОВ
help.start.heading=1. Создание и сохранение кейбинда
help.start.body=Откройте Keybinder через его кнопку на HUD или включите окно в настройках HUD игры. Нажмите ДОБАВИТЬ НОВЫЙ КЕЙБИНД, введите понятное название, выберите клавишу или кнопку мыши и при необходимости Shift, Ctrl или Alt. Также доступны прокрутка колеса вверх и вниз. Добавьте действия, инструменты и цели. Готово проверяет и сохраняет запись; Отмена отменяет несохранённые изменения. Если клавиша занята, сначала изучите конфликт. Поля автора и сервера показывают происхождение записи; кнопки обновления подставляют текущего персонажа и сервер.
help.actions.heading=2. Действия и их порядок
help.actions.body=Вариант содержит собственную последовательность шагов. Выберите действие из текущего каталога Wurm или каталога обнаруженного мода. Действие по ID также позволяет вводить числовой ID действия: именно число определяет действие, независимо от его названия. + вставляет шаг, x удаляет; перетаскивание меняет порядок. Нажатия в редакторе не выполняют игровые действия. Сменить инструмент меняет активный инструмент для следующих шагов. Команда консоли выполняет введённую команду. Умное улучшение ищет необходимые инструменты и материалы в выбранном порядке источников; Опознание фрагментов использует щётку или зубило, указанное в данных фрагмента.
help.sources.heading=3. Источник: чем выполнять действие?
help.sources.body=Инструмент — инструмент или предмет, которым выполняется действие; Цель — объект, над которым оно выполняется. Текущий инструмент использует уже активный инструмент. Пустая рука отправляет действие без инструмента. Предмет под указателем использует один предмет инвентаря под указателем. Для Слот панели и Слот экипировки сначала включите выбор, затем нажмите нужный слот в игре. Сохраняется ссылка на слот; его содержимое определяется при выполнении, поэтому предмет можно заменить. Инвентарь + фильтр ищет по сохранённым условиям. Захваченный Точный объект означает конкретный предмет и может не работать на другом персонаже или сервере.
help.targets.heading=4. Цель: куда отправлять действие?
help.targets.body=Под указателем использует объект под указателем в момент запуска кейбинда. Выбранный объект использует текущую выбранную цель Wurm. Активный инструмент — активный предмет, Тело персонажа — ваш персонаж. Цели Слот панели и Слот экипировки используют выбранный слот. В сетке 3x3 Ц означает текущую клетку, остальные кнопки — соседние направления. Вся область 3×3 выбирает все девять клеток и обычно занимает девять мест в очереди. Объекты рядом и Рядом + фильтр используют дальность самого действия. Если Event сообщает об объекте вне дальности, подойдите ближе. Радиус должен быть конечным положительным числом; число найденных целей и стоимость проверяются при выполнении.
help.multi.heading=5. Multi: запомнить действие и повторять коротким нажатием
help.multi.body=Multi подходит для многократного выполнения одного выбранного действия, когда иногда нужно менять назначение клавиши. Добавьте два или больше вариантов и оставьте Quick выключенным в конструкторе. Дайте вариантам понятные названия; у каждого может быть своя цепочка действий, источники и цели. Короткое нажатие выполняет активный, запомненный вариант. Удерживайте клавишу не менее 0,2 секунды, чтобы открыть меню, затем нажмите вариант для сохранения его как нового активного действия. Сам выбор в этом меню ничего не выполняет: действие запустится при следующем коротком нажатии. Например, разместите Chop, Dig и Mine на одной клавише. Один раз удержите её и выберите Dig, затем нажимайте коротко для повторного копания; снова удержите для перехода на Mine. Если закрыть меню без выбора, прежний активный вариант сохранится. В списке используется тег (Multi). При единственном варианте и выключенном Quick клавиша работает как обычная прямая привязка. Плюс и минус разворачивают и сворачивают варианты; перетаскивание заголовков меняет их порядок; изогнутая стрелка извлекает вариант в отдельный кейбинд.
help.hud.heading=6. Quick: много быстрых действий в одном меню
help.hud.body=Quick — библиотека действий, к которым нужен быстрый доступ без отдельной клавиши для каждого. Включите Quick в конструкторе и добавьте варианты с понятными названиями. Каждое нажатие сразу открывает меню; удержание не требуется. Нажмите вариант, и его цепочка действий выполнится сразу. Выбор не меняет запомненное основное действие, а повторное нажатие для запуска не нужно. Следующее нажатие снова открывает всё меню: при каждом использовании вы заново выбираете действие. Закрытие меню без выбора ничего не выполняет. Quick поддерживает один или много вариантов и обозначается тегом (Quick), даже если вариантов несколько. Например, добавьте в Q варианты Inventory, Backpack, Repair, Drink water и Pray: нажмите Q, выберите Drink water — действие сразу выполнится; в следующий раз нажмите Q и выберите любое другое действие. Главное различие в смысле выбора: Quick — выбрать и выполнить сейчас; Multi — выбрать и запомнить, затем повторять короткими нажатиями. Выполняется только выбранный вариант, а не все альтернативы вместе. У каждого варианта свои источники, цели и стоимость очереди. Сам тег Quick или Multi не отправляет дополнительного игрового действия и не занимает место в очереди.
help.capture.heading=7. Захват действий из игры
help.capture.body=Выберите Захватить для нужного шага, затем выполните действие в Wurm обычным способом. Keybinder наблюдает за действием, не повторяя и не блокируя его. Проверьте захваченные действие, источник и цель. Если переносимую цель нельзя определить однозначно, укажите её вручную перед сохранением. Выбор слота панели инструментов или экипировки также ожидает одно явное нажатие. Отмена или закрытие завершает режим захвата. Работа с меню, выбор слотов и открытие справки не записываются как игровые действия.
help.queue.heading=8. Лимит очереди и выполнение
help.queue.body=Текущий лимит предоставляет Wurm. Шаги считает шаги редактора, Действий в очереди — действия, отправляемые серверу. Локальная активация инструмента стоит ноль; обычное действие на одну цель чаще всего стоит одно место; Вся область 3×3 — девять. Радиус и несколько целей требуют проверки при выполнении. Подготовленная последовательность проверяется до отправки первого действия, поэтому превышающая лимит цепочка не отправляется частично. Отсутствующие инструменты и цели объясняются в Event. Исправьте указанную причину отключения записи; больший доступный лимит может снова сделать её допустимой, если клавиша свободна. Монитор очереди можно расположить слева или справа.
help.organize.heading=9. Управление списком кейбиндов
help.organize.body=Двойное нажатие на строку или Изменить открывает конструктор. Копия создаёт самостоятельную копию; задайте ей своё имя и клавишу. + слева добавляет запись под выбранной строкой; x удаляет после подтверждения. Перетаскивайте строку между другими для изменения порядка. Если бросить её в центре другой строки, варианты объединятся; проверьте результат. Флажок «Вкл.» включает или выключает запись для текущего персонажа. Цвета и подсказки показывают состояние, конфликты и ограничения очереди. Колесо прокручивает список, также можно тянуть бегунок. Когда весь список помещается, полоса прокрутки исчезает.
help.profiles.heading=10. Фильтры пользователя и сервера
help.profiles.body=Пользователь и Сервер фильтруют видимые записи по данным их создания. Включить по фильтру и Выключить по фильтру меняют состояние отфильтрованных записей для текущего персонажа. Фильтр не удаляет записи, не меняет клавиши и не переключает подключённый сервер. Проверьте фильтры, если сохранённый кейбинд не виден. Для записей другого пользователя могут понадобиться другая клавиша, источник или цель.
help.transfer.heading=11. Импорт, экспорт и удаление мода
help.transfer.body=Импорт из Wurm открывает просмотр существующих привязок Wurm. Отметьте только нужные записи; само открытие ничего не меняет. Поддерживаемые команды прежних модов превращаются в собственные записи Keybinder. После переноса отключите прежние моды, чтобы их обработчики не конкурировали. Импорт файла позволяет проверить файл .keybinder; Экспорт всех сохраняет записи для резервной копии или обмена. Проверьте точные ссылки на предметы при переносе на другого персонажа или сервер. Удаление мода восстанавливает сохранённые исходные привязки, если позволяет владение и клавиша свободна, и удаляет только привязки, которыми всё ещё владеет Keybinder. Чужие привязки не перезаписываются молча; конфликты показываются пользователю.
help.language.heading=12. Язык и диагностика
help.language.body=Выберите один из четырёх языков в заголовке Keybinder или на экране общего апдейтера. Выбор синхронизируется между ними независимо от мода, открывшего апдейтер, и применяется сразу без перезапуска игры. Открытые черновики и меню сохраняют введённый текст и выбранные значения. Сообщения с префиксом [Keybinder] появляются во вкладке Event; используйте текст причины для исправления записей. Консольная команда keybinder_list печатает управляемые привязки. В разделе О моде находятся версия, лицензия и исходные проекты. Ссылки открываются после нажатия кнопки. Поля URL можно выделить и скопировать, если браузер не открывается.
help.about.description=Keybinder — клиентский мод Wurm Unlimited для привязок клавиатуры и мыши, цепочек действий, вариантов Multi и Quick, Умного улучшения и Опознания фрагментов.
help.about.credits=Спасибо bdew, автору оригинального Custom Actions, и разработчикам Improved Improve и i2improve, чья работа послужила основой унаследованного поведения улучшения.
