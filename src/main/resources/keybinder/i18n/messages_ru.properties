help.constructor_heading=КОНСТРУКТОР КЕЙБИНДОВ
help.start.heading=1. Создание и сохранение кейбинда
help.start.body=Откройте Keybinder через его кнопку на HUD или включите окно в настройках HUD игры. Нажмите ADD NEW KEYBIND, введите понятное название, выберите клавишу или кнопку мыши и при необходимости Shift, Ctrl или Alt. Также доступны прокрутка колеса вверх и вниз. Добавьте действия, инструменты и цели. DONE проверяет и сохраняет запись; CANCEL отменяет несохранённые изменения. Если клавиша занята, сначала изучите конфликт. Поля автора и сервера показывают происхождение записи; кнопки обновления подставляют текущего персонажа и сервер.
help.actions.heading=2. Действия и их порядок
help.actions.body=Вариант содержит собственную последовательность шагов. Выберите действие из текущего каталога Wurm или каталога обнаруженного мода. Custom action также позволяет вводить числовой ID действия: именно число определяет действие, независимо от его названия. + вставляет шаг, x удаляет; перетаскивание меняет порядок. Нажатия в редакторе не выполняют игровые действия. Activate item меняет активный инструмент для следующих шагов. Console command выполняет введённую команду. Smart Improve ищет необходимые инструменты и материалы в выбранном порядке источников; Archaeology Identify использует щётку или зубило, указанное в данных фрагмента.
help.sources.heading=3. Источник: чем выполнять действие?
help.sources.body=Source — инструмент или предмет, которым выполняется действие; Target — объект, над которым оно выполняется. Current active item использует уже активный инструмент. Empty hand отправляет действие без инструмента. Hovered item использует один предмет инвентаря под указателем. Для Toolbelt и Equipment сначала включите выбор, затем нажмите нужный слот в игре. Сохраняется ссылка на слот; его содержимое определяется при выполнении, поэтому предмет можно заменить. Inventory filter ищет по сохранённым условиям. Захваченный Exact object означает конкретный предмет и может не работать на другом персонаже или сервере.
help.targets.heading=4. Цель: куда отправлять действие?
help.targets.body=Hover использует объект под указателем в момент запуска кейбинда. Selected использует текущую выбранную цель Wurm. Tool — активный предмет, Body — ваш персонаж. Цели Toolbelt и Equipment используют выбранный слот. В сетке 3x3 C означает текущую клетку, остальные кнопки — соседние направления. Area выбирает все девять клеток и обычно занимает девять мест в очереди. Nearby и Nearby by type используют дальность самого действия. Если Event сообщает об объекте вне дальности, подойдите ближе. Радиус должен быть конечным положительным числом; число найденных целей и стоимость проверяются при выполнении.
help.multi.heading=5. MULTI: несколько вариантов на одной клавише
help.multi.body=ADD VARIANT добавляет ещё одну последовательность под той же клавишей. Дайте каждому варианту короткое подназвание, чтобы узнавать его в меню. Обычный Multi с двумя или более вариантами выполняет активный вариант при коротком нажатии. Удерживайте клавишу не менее 0,2 секунды, чтобы открыть меню и выбрать другой активный вариант. Следующее короткое нажатие выполнит этот выбор. У каждого варианта свои действия, источники, цели и стоимость; альтернативы не выполняются вместе. Плюс и минус разворачивают и сворачивают вариант. Перетаскивайте заголовки для изменения порядка. Изогнутая стрелка извлекает вариант в отдельный кейбинд; назначьте ему новую клавишу перед использованием.
help.hud.heading=6. HUD action: сразу открыть меню выбора
help.hud.body=HUD — Head-Up Display, то есть окна и элементы управления поверх игрового мира. Включите HUD action в конструкторе, чтобы клавиша сразу открывала меню вариантов, даже если вариант всего один. Нажмите пункт меню для выполнения его последовательности. В отличие от обычного Multi, этот режим не сохраняет выбранный вариант как новый активный по умолчанию: каждое нажатие снова открывает меню. Например, одна HUD-клавиша может предлагать отдельные варианты Repair, Improve и Examine. HUD и Multi описывают поведение кейбинда; сами по себе они не являются игровыми действиями и не занимают очередь.
help.capture.heading=7. Захват действий из игры
help.capture.body=Выберите Capture для нужного шага, затем выполните действие в Wurm обычным способом. Keybinder наблюдает за действием, не повторяя и не блокируя его. Проверьте захваченные действие, источник и цель. Если переносимую цель нельзя определить однозначно, укажите её вручную перед сохранением. Выбор слота панели инструментов или экипировки также ожидает одно явное нажатие. Отмена или закрытие завершает режим захвата. Работа с меню, выбор слотов и открытие справки не записываются как игровые действия.
help.queue.heading=8. Лимит очереди и выполнение
help.queue.body=Текущий лимит предоставляет Wurm. Steps считает шаги редактора, Queued actions — действия, отправляемые серверу. Локальная активация инструмента стоит ноль; обычное действие на одну цель чаще всего стоит одно место; Area — девять. Радиус и несколько целей требуют проверки при выполнении. Подготовленная последовательность проверяется до отправки первого действия, поэтому превышающая лимит цепочка не отправляется частично. Отсутствующие инструменты и цели объясняются в Event. Исправьте указанную причину отключения записи; больший доступный лимит может снова сделать её допустимой, если клавиша свободна. Монитор очереди можно расположить слева или справа.
help.organize.heading=9. Управление списком кейбиндов
help.organize.body=Двойное нажатие на строку или EDIT открывает конструктор. DUPLICATE создаёт самостоятельную копию; задайте ей своё имя и клавишу. + слева добавляет запись под выбранной строкой; x удаляет после подтверждения. Перетаскивайте строку между другими для изменения порядка. Если бросить её в центре другой строки, варианты объединятся; проверьте результат. Флажок On включает или выключает запись для текущего персонажа. Цвета и подсказки показывают состояние, конфликты и ограничения очереди. Колесо прокручивает список, также можно тянуть бегунок. Когда весь список помещается, полоса прокрутки исчезает.
help.profiles.heading=10. Фильтры пользователя и сервера
help.profiles.body=User и Server фильтруют видимые записи по данным их создания. ENABLE FILTERED и DISABLE FILTERED меняют состояние отфильтрованных записей для текущего персонажа. Фильтр не удаляет записи, не меняет клавиши и не переключает подключённый сервер. Проверьте фильтры, если сохранённый кейбинд не виден. Для записей другого пользователя могут понадобиться другая клавиша, источник или цель.
help.transfer.heading=11. Импорт, экспорт и удаление мода
help.transfer.body=IMPORT WURM BINDS открывает просмотр существующих привязок Wurm. Отметьте только нужные записи; само открытие ничего не меняет. Поддерживаемые команды прежних модов превращаются в собственные записи Keybinder. После переноса отключите прежние моды, чтобы их обработчики не конкурировали. IMPORT FILE позволяет проверить файл .keybinder; EXPORT ALL сохраняет записи для резервной копии или обмена. Проверьте точные ссылки на предметы при переносе на другого персонажа или сервер. PREPARE MOD REMOVAL восстанавливает сохранённые исходные привязки, если позволяет владение и клавиша свободна, и удаляет только привязки, которыми всё ещё владеет Keybinder. Чужие привязки не перезаписываются молча; конфликты показываются пользователю.
help.language.heading=12. Язык и диагностика
help.language.body=Переключатель языка расположен в заголовке слева от кнопок управления окном. Изменение языка при открытом конструкторе или меню Multi применяется после закрытия, сохраняя черновик. Сообщения с префиксом [Keybinder] появляются во вкладке Event; используйте текст причины для исправления записей. Консольная команда keybinder_list печатает управляемые привязки. В разделе About находятся версия, лицензия и исходные проекты. Ссылки открываются только после явного нажатия кнопки. Поля URL можно выделить и скопировать, если браузер не открывается.
help.about.description=Keybinder — клиентский мод Wurm Unlimited для привязок клавиатуры и мыши, цепочек действий, вариантов Multi и HUD, Smart Improve и Archaeology Identify.
help.about.credits=Спасибо bdew, автору оригинального Custom Actions, и разработчикам Improved Improve и i2improve, чья работа послужила основой унаследованного поведения улучшения.
