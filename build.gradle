apply plugin: 'java'

group "org.keybinder.wurm"
version "0.11.6"

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    def requiredClientLibraries = [
            'libs/client-patched.jar',
            'libs/common.jar',
            'libs/javassist.jar',
            'libs/modlauncher.jar'
    ]
    requiredClientLibraries.each { library ->
        if (!file(library).isFile()) {
            throw new GradleException("Required pinned client library is missing: ${library}")
        }
    }
    compile files(requiredClientLibraries)
    testCompile 'junit:junit:4.13.2'
}

jar {
    archiveName "${project.name}.jar"
    exclude 'keybinder/*.png'
}


task verifyVersion {
    doFirst {
        def expected = project.version.toString()
        if (!(expected ==~ /0\.\d+\.\d+/)) {
            throw new GradleException("Keybinder release version must match 0.x.y, got ${expected}")
        }
        def metadata = [
            [file('mods/keybinder.properties'), /(?m)^version=(.+)$/, 'properties'],
            [file('src/main/java/org/keybinder/wurm/KeybinderMod.java'),
             /VERSION = "([^"]+)"/, 'KeybinderMod'],
            [file('readme.md'), /Keybinder (0\.\d+\.\d+)/, 'GitHub README'],
            [file('README.txt'), /Keybinder (0\.\d+\.\d+)/, 'ZIP README']
        ]
        metadata.each { item ->
            def matcher = (item[0].getText('UTF-8') =~ item[1])
            if (!matcher.find() || matcher.group(1) != expected) {
                throw new GradleException(
                        "Version mismatch in ${item[2]}: expected ${expected}")
            }
        }
        if (!file('images/keybinder-banner.png').isFile() ||
                !file('readme.md').getText('UTF-8').contains('images/keybinder-banner.png')) {
            throw new GradleException('GitHub README must reference the separate project banner')
        }
    }
}

task verifyJarNamespace(dependsOn: jar) {
    doLast {
        def tree = zipTree(jar.archivePath)
        def forbidden = tree.matching {
            include 'net/bdew/**'
            include 'net/chamomilo/**'
            include 'com/chamomilo/**'
            include 'improvemod/**'
            include 'net/inniria/**'
        }.files
        if (!forbidden.empty) {
            throw new GradleException("Legacy implementation classes found in keybinder.jar: ${forbidden}")
        }
        if (tree.matching { include 'org/keybinder/wurm/KeybinderMod.class' }.files.empty) {
            throw new GradleException("Keybinder main class is missing from keybinder.jar")
        }
        ['keybinder/i18n/messages_en.properties',
         'keybinder/i18n/messages_pt-BR.properties',
         'keybinder/i18n/messages_de.properties',
         'keybinder/i18n/messages_ru.properties',
         'keybinder/value-pack.keybinder'].each { resource ->
            if (tree.matching { include resource }.files.empty) {
                throw new GradleException("Required resource is missing from keybinder.jar: ${resource}")
            }
        }
    }
}

task dist(type: Zip, dependsOn: [test, verifyVersion, verifyJarNamespace]) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL

    into("mods", {
        into(project.name, {
            from jar
            from 'README.txt'
            from 'LICENSE'
            from 'lgpl-3.0.txt'
            into('assets/keybinder') {
                from 'src/main/resources/keybinder'
                include '*.png'
                exclude 'tile-selector.png' // Retired raster UI; the selector uses branded native buttons.
            }
        })
        from 'mods/keybinder.properties'
    })

    archiveName "${project.name}-${project.version}.zip"

}

task verifyDistArchive(dependsOn: dist) {
    doLast {
        def archive = new java.util.zip.ZipFile(dist.archivePath)
        try {
            def entries = java.util.Collections.list(archive.entries()).findAll { !it.directory }
            def expected = [
                    'mods/keybinder.properties',
                    'mods/keybinder/keybinder.jar',
                    'mods/keybinder/README.txt',
                    'mods/keybinder/LICENSE',
                    'mods/keybinder/lgpl-3.0.txt',
                    'mods/keybinder/assets/keybinder/kb-tag.png'
            ] as Set
            if ((entries.collect { it.name } as Set) != expected || entries.size() != expected.size()) {
                throw new GradleException('Distribution contains unexpected or missing files: ' +
                        entries.collect { it.name })
            }
            def readme = archive.getInputStream(archive.getEntry('mods/keybinder/README.txt'))
            try {
                if (readme.getText('UTF-8') != file('README.txt').getText('UTF-8')) {
                    throw new GradleException('ZIP README differs from the reviewed plain-text README')
                }
            } finally { readme.close() }
        } finally { archive.close() }
        def expectedJarPath = "mods/${project.name}/${project.name}.jar"
        def packagedJars = zipTree(dist.archivePath).matching {
            include expectedJarPath
        }.files
        if (packagedJars.size() != 1) {
            throw new GradleException(
                    "Expected exactly one ${expectedJarPath} in ${dist.archiveName}")
        }
        def packagedJar = packagedJars.iterator().next()
        def nested = zipTree(packagedJar)
        if (!nested.matching { include '**/keybinder-banner.png', '**/*.md', '**/*.markdown' }.files.empty) {
            throw new GradleException('README artwork and Markdown must not be embedded in the JAR')
        }
        ['keybinder/i18n/messages_en.properties',
         'keybinder/i18n/messages_pt-BR.properties',
         'keybinder/i18n/messages_de.properties',
         'keybinder/i18n/messages_ru.properties',
         'keybinder/value-pack.keybinder'].each { resource ->
            if (nested.matching { include resource }.files.empty) {
                throw new GradleException(
                        "Required resource is missing from distribution JAR: ${resource}")
            }
        }
    }
}

build.dependsOn verifyJarNamespace, verifyDistArchive

test {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

ext.chamomiloUpdate = [id: 'keybinder', name: 'Keybinder', repo: 'chamomilo/wurm-keybinder', asset: 'keybinder-{version}.zip', properties: 'mods/keybinder.properties', main: 'src/main/java/org/keybinder/wurm/KeybinderMod.java']
apply from: 'gradle/chamomilo-updater.gradle'

task verifyKeybinderUi(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    def javaFx = System.getenv('WURM_JFX') ?: System.getenv('WURM_JAVAFX_JAR')
    if (javaFx) classpath += files(javaFx)
    main = 'org.keybinder.wurm.ui.ChamomiloUiProbe'
    args file("${buildDir}/chamomilo-preview").absolutePath
}
check.dependsOn verifyKeybinderUi
dist.dependsOn verifyKeybinderUi
