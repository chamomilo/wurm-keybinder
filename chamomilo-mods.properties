# Public catalogue consumed at every Wurm startup. Add a mod here without updating clients.
catalogVersion=1
mods=keybinder,wurm-waypointer,WU-third_person_view,wurm-highres,highres-hud,highres-startup,armor-material-colors,idleanimations

keybinder.name=Keybinder
keybinder.repo=chamomilo/wurm-keybinder
keybinder.asset=keybinder-{version}.zip
keybinder.class=org.keybinder.wurm.KeybinderMod

wurm-waypointer.name=Waypointer
wurm-waypointer.repo=chamomilo/wurm-waypointer
wurm-waypointer.asset=wurm-waypointer-{version}.zip
wurm-waypointer.class=org.waypoints.next.WurmWaypointerMod

WU-third_person_view.name=Third Person View
WU-third_person_view.repo=chamomilo/WU-3rd-person-view
WU-third_person_view.asset=WU-third_person_view-{version}.zip
WU-third_person_view.class=org.wuthirdpersonview.client.WUThirdPersonViewMod

wurm-highres.name=High Res Icons
wurm-highres.repo=chamomilo/wurm-high-res-icons
wurm-highres.asset=WURM-High-Res-Icons-{version}.zip
wurm-highres.class=org.wurmhighres.client.WurmHighresMod

highres-hud.name=HighRes HUD
highres-hud.repo=chamomilo/Wurm-HighRes-HUD
highres-hud.asset=highres-hud-{version}.zip
highres-hud.class=org.highreshud.client.HighResHudMod

highres-startup.name=HighRes Startup
highres-startup.repo=chamomilo/wurm-highres-startup
highres-startup.asset=highres-startup-{version}.zip
highres-startup.class=org.highresstartup.client.HighResStartupMod

armor-material-colors.name=Material Colors
armor-material-colors.repo=chamomilo/wurm-material-colors
armor-material-colors.asset=armor-material-colors-{version}.zip
armor-material-colors.class=org.armormaterialcolors.client.ArmorMaterialColorsMod

idleanimations.name=Idle Animations
idleanimations.repo=chamomilo/wurm-idle-animations
idleanimations.asset=idleanimations-{version}.zip
idleanimations.class=org.wuidleanimations.client.IdleAnimationsMod
