# Public catalogue consumed at every Wurm startup. Add a mod here without updating clients.
catalogVersion=1
mods=keybinder,wurm-waypointer,WU-third_person_view,wurm-highres,highres-hud,highres-startup,armor-material-colors,alarmclock

keybinder.name=Keybinder
keybinder.repo=chamomilo/wurm-keybinder
keybinder.asset=keybinder-{version}.zip
keybinder.class=org.keybinder.wurm.KeybinderMod
keybinder.logoUrl=https://raw.githubusercontent.com/chamomilo/wurm-keybinder/main/images/keybinder-logo-128.png

